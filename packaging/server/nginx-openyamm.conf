# OpenYAMM release hosting (packaging/UPDATER_PLAN.md, 7.5). Include inside the jasicek.net server block, and add
#   limit_conn_zone $binary_remote_addr zone=openyamm_per_ip:10m;
# to http {} (and raise worker_connections to 4096). Files live in /var/www/html/openyamm, uploaded by the release
# workflow (packaging/publish_release.py); nothing else runs on the server. /openyamm-staging/ holds test releases
# with the same rules (packaging/RELEASE.md).
# limit_conn counts connections per address: a household or a mobile carrier puts many players behind one, and each
# download opens 3 (the updaters retry after a 503, see engine/update/AppUpdater.cpp).

location ~ ^/openyamm(-staging)?/updates/(channels|history)/ {
    add_header Cache-Control "public, max-age=300" always;
}

location ~ ^/openyamm(-staging)?/updates/packs/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    limit_conn openyamm_per_ip 16;
}

location ~ ^/openyamm(-staging)?/updates/apps/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    limit_conn openyamm_per_ip 16;
}

location ~ ^/openyamm(-staging)?/downloads/ {
    limit_conn openyamm_per_ip 16;
}
