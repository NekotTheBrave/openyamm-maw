app-id: io.github.openyamm.OpenYAMM
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: openyamm

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --socket=pulseaudio

modules:
  - name: openyamm
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=ON
      - -DOPENYAMM_BUILD_EDITOR=OFF
      - -DOPENYAMM_BUILD_TOOLS=OFF
      - -DOPENYAMM_BUILD_TESTS=OFF
      - -DOPENYAMM_RUNTIME_SHADER_PATH=/app/share/openyamm/runtime/shaders
    post-install:
      - mv /app/bin/openyamm /app/bin/openyamm-bin
      - install -Dm755 ../packaging/flatpak/openyamm-flatpak /app/bin/openyamm
      - cmake -DOPENYAMM_SETTINGS_TEMPLATE=../settings_release.ini -DOPENYAMM_SETTINGS_OUTPUT=/app/share/openyamm/settings.ini -DOPENYAMM_SETTINGS_ASSET_ROOT=/app/share/openyamm/assets -P ../cmake/CreateOpenYammReleaseSettings.cmake
      - install -Dm644 ../packaging/flatpak/io.github.openyamm.OpenYAMM.desktop /app/share/applications/io.github.openyamm.OpenYAMM.desktop
      - rm -rf /app/include /app/lib/cmake /app/lib/pkgconfig /app/lib/libphysfs.a /app/lib64/cmake /app/lib64/pkgconfig /app/lib64/libphysfs.a
      - test -f /app/share/openyamm/assets/engine.zip
      - test -f /app/share/openyamm/assets/worlds/mm6.zip
      - test -f /app/share/openyamm/assets/worlds/mm7.zip
      - test -f /app/share/openyamm/assets/worlds/mm8.zip
    sources:
      - type: dir
        path: ../../build/flatpak/source
