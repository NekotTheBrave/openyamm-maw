; OpenYAMM settings
; Volumes use the original-style 0..9 scale.

[assets]
root=

[audio]
sound_volume=3
music_volume=4
voice_volume=4

[controls]
turn_rate=smooth
control_scheme=modern
walksound=true
show_hits=true
always_run=true
flip_on_exit=false
mouse_sensitivity=100
invert_mouse_y=false

[gameplay]
keyboard_interaction_depth=512
mouse_interaction_depth=512
combat_text=true
enemy_health_bars=combat
enemy_health_bar_values=target
enemy_health_bar_damage_trail=true
quest_markers=true
melee_hit_blood_effects=true
melee_hit_feedback=true
melee_hit_effects=true
melee_hit_flash=false
melee_camera_kick=false
corpses=satchel
context_action_popup=false

[startup]
start_in_main_menu=true
save_file=

[features]
bolster_monsters=false
indoor_pathfinding=true
outdoor_pathfinding=true
blaster_skill_scaling=scaling_damage
blaster_min_recovery=default

[logging]
indoor_visibility=false
indoor_pathfinding=false
outdoor_pathfinding=false
fps_trace=true
performance_trace=false
hitch_trace=false
collision_trace=false
gameplay_trace=false
gameplay_trace_file=logs/gameplay_trace.log
gameplay_trace_append=true
combat_trace=false
combat_trace_file=logs/combat_trace.log
combat_trace_append=true
hitch_threshold_ms=40

[input]
forward=W
backward=S
left=A
right=D
yell=Y
jump=X
combat=Return
cast_ready=Q
attack=MouseLeft
trigger=Space
cast=C
pass=B
char_cycle=Tab
quest=I
quick_ref=Z
rest=R
history=H
use=E
map_book=L
always_run_toggle=U
look_up=Page_Down
look_down=Delete
center_view=End
zoom_in=Add
zoom_out=Subtract
fly_up=J
fly_down=K
land=Home
double_speed=F2

[video]
blood_splats=true
colored_lights=true
tinting=false
shadows=true
model_shadow_quality=2
model_lods=true
creature_outlines=false
sprite_outline=false
texture_filtering=true
ambient_occlusion=false
ambient_occlusion_strength=100
bloom=false
bloom_strength=65
cinematic_grading=true
cinematic_strength=60
sharpening=50
antialiasing=4x
lightmaps=true
baked_sun_strength=1
baked_sky_strength=2
baked_sun_color=1,1,1
baked_sky_color=0.800000012,0.899999976,1
terrain_decorations=true
water_reflections=true
water_movement_ripples=true
water_sprite_reflections=true
water_reflection_size=512
terrain_subdivision=4
terrain_antitiling=true
sky_resolution_scale=1
weather_quality=high
light_grid=high
rain_ripples=true
wet_surfaces=true
terrain_specular=true
terrain_filtering=anisotropic
terrain_anisotropy=8x
bmodel_filtering=anisotropic
billboard_filtering=linear
ui_filtering=linear
text_filtering=nearest
minimap_filtering=linear
view_distance=default
outdoor_billboard_depth_slice=256
skip_event_cutscenes=true
wait_for_level_sprites=true
window_mode=windowed
resolution=1920x1080
vsync=true

[video_quality]
sky=x1
decorations=x2
prefer_restored_icons=true
icons=x1

[debug]
preseed_party=false
party_seed_roster_id=0
start_world=mm7
start_map_file=oute3.odm
override_start_position=false
start_x=0
start_y=0
start_z=0
start_flying=false
movement_speed_multiplier=1
turbo_movement=true
immortal=false
unlimited_mana=false
new_game_god_lich=true
allow_incomplete_character_creation=false
console=true
actor_models=true
