# Projectile visuals: recipe name -> named effects. No projectile or impact draws its native sprite (the regression
# case projectile_visuals_draw_no_native_sprites checks it): solid projectiles are 3D models
# (engine/models/projectiles.yml), the rest are drawn by these effects or their recipe's particles.
# flight replaces the recipe's trail particles or flat beam while it flies; settled plays while it lies on the ground;
# impact replaces the recipe's impact burst and native impact sprite (the impact light stays); impact_follows_target
# keeps the impact on the struck actor. Spells that strike at once (Implosion, Inferno, Prismatic Light...) play their
# impact on each actor they strike. For a debuff applied at once (Shrinking Ray), flight is a visual-only bolt from the
# party to the target and the impact plays when it arrives. return_flight flies from each impact back to the casting
# party (drains). Armageddon's impact is its meteor strike, rained around the party and on every nearby creature.
# sprite (native|hidden) and light {rgb, radius} override the recipe's native sprite and flight light: the sprite is
# hidden where the effect draws the whole head (a binding may name only sprite: hidden). variants rebind a recipe for
# the monsters listed by picture name (monster_data.txt "Picture"); their keys override the recipe's. The effects are
# generated by tools/fx/generate_projectile_effects.py; see PROJECTILE_VFX_ALL_PROPOSAL.md.
# Not bound: stun (debuff particles only); cannonballs bypass projectile effects.
schema: openyamm.projectileEffects.v1
# A projectile falling into water.
water_splash: openyamm:fx/impact/water_small
projectiles:
  # Fire
  fire_bolt: {flight: openyamm:fx/projectile/fire_bolt, impact: openyamm:fx/impact/fire_small}
  monster_fire_bolt:
    flight: openyamm:fx/projectile/monster_fire_bolt
    impact: openyamm:fx/impact/fire_small
    variants:
      - monsters: [Dragon A, Dragon B, Dragon C, ADragon C, DragonCave A, BDragonFly A, DragonCover A, Hydra A]
        flight: openyamm:fx/projectile/dragon_fire
        impact: openyamm:fx/impact/fire_large
        light: {rgb: [255, 140, 50], radius: 260}
      - monsters: [Gog A, Gog B, Gog C, AGog A, AGog B, AGog C, ElemFire A]
        flight: openyamm:fx/projectile/lava_glob
        impact: openyamm:fx/impact/lava_splash
      - monsters: [Elemental Fire A, Elemental Fire B, Elemental Fire C, ElemFire B, ElemFire C, Genie B, BGenie C]
        flight: openyamm:fx/projectile/living_flame
  fireball: {flight: openyamm:fx/projectile/fireball, impact: openyamm:fx/impact/fireball}
  dragon_breath:
    flight: openyamm:fx/projectile/flame_gout
    sprite: hidden
    impact: openyamm:fx/impact/fireball
    light: {rgb: [255, 140, 50], radius: 240}
  incinerate:
    flight: openyamm:fx/projectile/incinerate
    sprite: hidden
    impact: openyamm:fx/impact/incinerate
    impact_follows_target: true
  meteor_shower: {flight: openyamm:fx/projectile/meteor, impact: openyamm:fx/impact/meteor}
  inferno: {impact: openyamm:fx/impact/inferno, impact_follows_target: true}
  immolation: {impact: openyamm:fx/impact/immolation, impact_follows_target: true}
  fire_spike:
    flight: openyamm:fx/projectile/fire_spike
    settled: openyamm:fx/projectile/fire_spike_mine
    impact: openyamm:fx/impact/fire_spike
  dark_fire_bolt:
    flight: openyamm:fx/projectile/dark_fire_bolt
    sprite: hidden
    impact: openyamm:fx/impact/dark_fire
    light: {rgb: [200, 60, 180], radius: 180}
  fire_arrow: {flight: openyamm:fx/projectile/fire_arrow, impact: openyamm:fx/impact/fire_arrow}
  # Air
  monster_air_bolt:
    flight: openyamm:fx/projectile/air_bolt
    impact: openyamm:fx/impact/air_small
    variants:
      - monsters: [ADragon A, DragonCave B, Titan A, Titan B, Titan C, BTitan A, BTitan B, BTitan C]
        flight: openyamm:fx/projectile/lightning_bolt
        impact: openyamm:fx/impact/lightning
  lightning_bolt: {flight: openyamm:fx/projectile/lightning_bolt, impact: openyamm:fx/impact/lightning}
  # The effect draws the whole crackling ball.
  sparks: {flight: openyamm:fx/projectile/sparks, impact: openyamm:fx/impact/air_small, sprite: hidden}
  starburst: {flight: openyamm:fx/projectile/starburst, impact: openyamm:fx/impact/starburst}
  implosion: {impact: openyamm:fx/impact/implosion, impact_follows_target: true}
  # Water
  monster_water_bolt:
    flight: openyamm:fx/projectile/monster_water_bolt
    impact: openyamm:fx/impact/water_small
    variants:
      - monsters: [Wimpy Dragon A, Wimpy Dragon B, Wimpy Dragon C, ADragon B, DragonCave C, BDragonFly B, DragonLand A,
          DragonLand B, DragonLand C, DragonCover B]
        flight: openyamm:fx/projectile/frost_breath
        impact: openyamm:fx/impact/ice
        light: {rgb: [130, 200, 255], radius: 200}
  ice_bolt: {flight: openyamm:fx/projectile/ice_bolt, impact: openyamm:fx/impact/ice}
  ice_blast_fallout: {flight: openyamm:fx/projectile/ice_shard, impact: openyamm:fx/impact/ice_shard}
  poison_spray: {flight: openyamm:fx/projectile/poison_spray, impact: openyamm:fx/impact/poison}
  acid_burst: {flight: openyamm:fx/projectile/acid_burst, impact: openyamm:fx/impact/acid}
  # Earth
  monster_earth_bolt: {flight: openyamm:fx/projectile/monster_earth_bolt, impact: openyamm:fx/impact/earth_small}
  rock_blast: {flight: openyamm:fx/projectile/rock_blast, impact: openyamm:fx/impact/rock}
  death_blossom: {flight: openyamm:fx/projectile/death_blossom, impact: openyamm:fx/impact/death_blossom}
  blades: {flight: openyamm:fx/projectile/blades, impact: openyamm:fx/impact/blades}
  # The effect draws the whole swarm; the native sprite was the old flat swarm.
  deadly_swarm:
    flight: openyamm:fx/projectile/deadly_swarm
    sprite: hidden
    impact: openyamm:fx/impact/deadly_swarm
    impact_follows_target: true
  mass_distortion:
    flight: openyamm:fx/projectile/mass_distortion
    impact: openyamm:fx/impact/mass_distortion
    impact_follows_target: true
  # Body
  monster_body_bolt: {flight: openyamm:fx/projectile/monster_body_bolt, impact: openyamm:fx/impact/body}
  harm: {flight: openyamm:fx/projectile/harm, impact: openyamm:fx/impact/harm, impact_follows_target: true}
  flying_fist: {flight: openyamm:fx/projectile/flying_fist, impact: openyamm:fx/impact/flying_fist}
  # Mind
  monster_mind_bolt: {flight: openyamm:fx/projectile/monster_mind_bolt, impact: openyamm:fx/impact/mind}
  mind_blast: {flight: openyamm:fx/projectile/mind_blast, impact: openyamm:fx/impact/mind_blast, sprite: hidden}
  # Spirit
  monster_spirit_bolt: {flight: openyamm:fx/projectile/monster_spirit_bolt, impact: openyamm:fx/impact/spirit}
  spirit_lash: {impact: openyamm:fx/impact/spirit_lash, impact_follows_target: true}
  # Light
  monster_light_bolt: {flight: openyamm:fx/projectile/monster_light_bolt, impact: openyamm:fx/impact/light_small}
  light_bolt: {flight: openyamm:fx/projectile/light_bolt, impact: openyamm:fx/impact/light_bolt}
  sunray: {flight: openyamm:fx/projectile/sunray, impact: openyamm:fx/impact/sunray}
  destroy_undead:
    flight: openyamm:fx/projectile/destroy_undead
    impact: openyamm:fx/impact/destroy_undead
    impact_follows_target: true
  prismatic_light: {impact: openyamm:fx/impact/prismatic_light, impact_follows_target: true, sprite: hidden}
  # Dark
  monster_dark_bolt:
    flight: openyamm:fx/projectile/monster_dark_bolt
    impact: openyamm:fx/impact/dark_small
    variants:
      - monsters: [Bone Dragon A, Bone Dragon B, Bone Dragon C]
        flight: openyamm:fx/projectile/necrotic_breath
        impact: openyamm:fx/impact/necrotic
        light: {rgb: [100, 210, 130], radius: 180}
  toxic_cloud:
    flight: openyamm:fx/projectile/toxic_cloud
    impact: openyamm:fx/impact/toxic_cloud
    light: {rgb: [100, 180, 50], radius: 130}
  sharpmetal: {flight: openyamm:fx/projectile/sharpmetal, impact: openyamm:fx/impact/blades}
  shrinking_ray:
    flight: openyamm:fx/projectile/shrinking_ray
    sprite: hidden
    impact: openyamm:fx/impact/shrinking_ray
    impact_follows_target: true
  souldrinker:
    impact: openyamm:fx/impact/souldrinker
    impact_follows_target: true
    return_flight: openyamm:fx/projectile/soul_drain
  # Vampires' Lifedrain.
  lifedrain:
    sprite: hidden
    impact: openyamm:fx/impact/lifedrain
    impact_follows_target: true
    return_flight: openyamm:fx/projectile/life_drain
  armageddon: {impact: openyamm:fx/impact/armageddon}
  # Technology and energy: robots and blaster wielders fire the blaster bolt; dragons and mages have their own.
  blaster:
    flight: openyamm:fx/projectile/blaster
    impact: openyamm:fx/impact/blaster
    # The effect draws the bolt; the native orange laser sprite would sit inside it as a second, older head.
    sprite: hidden
    light: {rgb: [255, 60, 40], radius: 170}
    variants:
      - monsters: [Crystal Dragon A, Crystal Dragon B, Crystal Dragon C, zUltra Dragon A, zUltra Dragon B,
          zUltra Dragon C, BDragonFly C, DragonCover C, Hydra C]
        flight: openyamm:fx/projectile/energy_breath
        impact: openyamm:fx/impact/energy_burst
        light: {rgb: [190, 150, 255], radius: 240}
      - monsters: [Mage C, Sorcerer C, BLich C]
        flight: openyamm:fx/projectile/arcane_bolt
        impact: openyamm:fx/impact/arcane_burst
        light: {rgb: [170, 100, 255], radius: 170}
  # Ordinary arrows keep only a faint streak.
  arrow: {flight: openyamm:fx/projectile/arrow}
  # Debuffs applied at once fly only when a map event casts them: no sprite then.
  charm: {sprite: hidden}
  blind: {sprite: hidden}
  telepathy: {sprite: hidden}
  berserk: {sprite: hidden}
  enslave: {sprite: hidden}
  control_undead: {sprite: hidden}
