  45: {party_buff: openyamm:fx/aura/party_utility}  # Detect Life
  48: {creature_debuff: openyamm:fx/aura/turn_undead}  # Turn Undead
  50: {party_buff: openyamm:fx/aura/party_ward}  # Preservation
  58: {party_buff: openyamm:fx/aura/party_ward}  # Mind Resistance
  60: {creature_debuff: openyamm:fx/aura/charm}  # Charm
  62: {creature_debuff: openyamm:fx/aura/berserk}  # Berserk
  63: {creature_debuff: openyamm:fx/aura/fear}  # Mass Fear
