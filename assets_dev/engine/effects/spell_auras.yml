  16: {party_buff: openyamm:fx/aura/party_utility}  # Jump
  17: {party_buff: openyamm:fx/aura/party_ward, creature_buff: openyamm:fx/aura/shield}  # Shield
  19: {party_buff: openyamm:fx/aura/party_utility}  # Invisibility
  21: {party_buff: openyamm:fx/aura/party_utility}  # Fly
