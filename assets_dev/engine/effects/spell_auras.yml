# Enhanced spell auras (video.projectile_style=enhanced): named effects that replace the procedural aura particles of
# buffs, heals and debuffs. creature_debuff plays on a creature when a party spell's debuff lands on it and
# creature_buff when a creature buffs or heals itself; both follow the creature and are sized to it. party_buff and
# heal play just in front of and below the party's eyes when it casts a buff or a heal or cure on itself. defaults
# apply to every spell of that kind without its own entry; spells are keyed by spell id (spells.txt). The effects are
# generated by tools/fx/generate_projectile_effects.py; see PROJECTILE_VFX_ALL_PROPOSAL.md.
schema: openyamm.spellAuraEffects.v1
defaults:
  creature_debuff: openyamm:fx/aura/debuff
  creature_buff: openyamm:fx/aura/blessing
  party_buff: openyamm:fx/aura/party_buff
  heal: openyamm:fx/aura/heal
spells:
  # Party buffs by family; the rest (Bless, Heroism, Haste, Day of the Gods...) use the golden default.
  1: {party_buff: openyamm:fx/aura/party_utility}  # Torch Light
  3: {party_buff: openyamm:fx/aura/party_ward}  # Fire Resistance
  4: {party_buff: openyamm:fx/aura/party_weapon}  # Fire Aura
  5: {creature_buff: openyamm:fx/aura/haste}  # Haste
  12: {party_buff: openyamm:fx/aura/party_utility}  # Wizard Eye
  13: {party_buff: openyamm:fx/aura/party_utility}  # Feather Fall
