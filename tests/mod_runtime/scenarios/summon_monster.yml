id: mod_runtime.summon_monster
title: Scripts can put a monster on the map and ask where a point stands
world: mm8
mode: faithful
tags:
- mod_runtime
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 100
      food: 5
      members:
      - name: Caller
        class: Knight
        level: 1
        skills: []
        equipment: {}
# The ground under the party is about where the party stands, and an outdoor map has no rooms.
- mod_lua:
    code: |
      local ground = Map.GetGroundLevel(Party.X, Party.Y)
      return math.abs(ground - Party.Z) < 200, Map.RoomFromPoint(Party.X, Party.Y, Party.Z), Map.Monsters.Limit
    expect: "true\t0\t3000"
# SummonMonster adds one monster of the kind, on the point, alive and hostile, and returns its record: the last
# of the list. What a script then writes to it is the monster's own.
- mod_lua:
    code: |
      local before = Map.Monsters.Count
      local x, y = Party.X + 400, Party.Y + 100
      local z = Map.GetGroundLevel(x, y)
      local m, index = SummonMonster(1, x, y, z)
      m.Group = 77
      return Map.Monsters.Count - before, index == before, m == Map.Monsters[index], m.Id, m.X == x, m.Y == y,
        m.HP > 0 and m.HP == m.FullHP, m.Hostile, m.IsDead, m.AIState ~= 11, Map.Monsters[index].Group
    expect: "1\ttrue\ttrue\t1\ttrue\ttrue\ttrue\ttrue\tfalse\ttrue\t77"
# A kind that does not exist adds nothing.
- mod_lua:
    code: |
      local before = Map.Monsters.Count
      return SummonMonster(30000, Party.X, Party.Y, Party.Z) == nil, Map.Monsters.Count - before
    expect: "true\t0"
# The summoned monster is one of the map's: it can be hit (the handler sees it) and it stays through a save and load.
- save_game: mod_summon_monster
- load_game: mod_summon_monster
- mod_lua:
    code: |
      local last = Map.Monsters[Map.Monsters.High]
      return last.Id, last.Group, last.HP > 0
    expect: "1\t77\ttrue"
# SummonItem puts an item on the ground at a point; the object it returns takes writes to its Item (which do not
# reach the placed item yet: map objects are not bound). A kind the item table does not have places nothing.
- mod_lua:
    code: |
      local obj = SummonItem(220, Party.X + 200, Party.Y, Party.Z + 100, 100)
      obj.Item.Bonus = 40
      return obj ~= nil, obj.Item.Number, SummonItem(250000, Party.X, Party.Y, Party.Z) == nil
    expect: "true\t220\ttrue"
# Ally 9999 is the original's mark for a monster that fights for the party. MAW summons wisps beyond the game's own
# that way (zzMaw-Spells.lua: Hostile = false, Ally = 9999 on what SummonMonster gives); they stay on the party's
# side for good, and read 9999 back, as the game's summons and controlled monsters do.
- mod_lua:
    code: |
      local x, y = Party.X + 300, Party.Y - 200
      local m, index = SummonMonster(1, x, y, Map.GetGroundLevel(x, y))
      Friend = index
      local hostileBefore = m.Hostile
      m.Hostile = false
      m.Ally = 9999
      PartyHP = Party[0].HP
      return hostileBefore, m.Ally, m.Hostile, Map.Monsters[0].Ally ~= 9999
    expect: "true\t9999\tfalse\ttrue"
- advance_runtime: {seconds: 5}
- mod_lua:
    code: |
      local m = Map.Monsters[Friend]
      return m.Ally, m.Hostile, m.HP > 0, Party[0].HP == PartyHP
    expect: "9999\tfalse\ttrue\ttrue"
- save_game: mod_summon_friend
- load_game: mod_summon_friend
- mod_lua:
    code: |
      local m = Map.Monsters[Friend]
      return m.Ally, m.Hostile
    expect: "9999\tfalse"
