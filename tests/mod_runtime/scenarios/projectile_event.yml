id: mod_runtime.projectile_event
title: An arrow shot by the party raises CalcDamageToMonster with the missile described, and the result is applied
world: mm8
mode: faithful
tags:
- mod_runtime
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 100
      food: 5
      members:
      - name: Archer
        class: DarkElf
        level: 60
        endurance: 3000
        accuracy: 500
        skills:
        - name: Bow
          level: 10
          mastery: 3
        equipment:
          bow: 56
# As in melee_event.yml, with the monsters ringed out of reach of a blow so that the attack is a shot. An arrow is
# "spell" 133 in the Merge's numbering, and the missile's Item is the bow.
- mod_lua:
    code: |
      ProbeHits = {}
      function events.CalcDamageToMonster(t)
        local attack, targetIndex = WhoHitMonster()
        local object = attack.Object
        ProbeHits[#ProbeHits + 1] = {
          kind = t.DamageKind, byPlayer = t.ByPlayer, melee = t.Melee,
          samePlayer = t.Player == Party[0] and attack.Player == t.Player,
          monsterIndex = t.MonsterIndex, targetIndex = targetIndex, hpBefore = t.Monster.HP,
          rawPositive = t.Damage > 0,
          spell = attack.Spell, objectSpell = object and object.Spell,
          bow = object and object.Item and object.Item.Number,
          placed = object ~= nil and (object.X ~= 0 or object.Y ~= 0),
        }
        t.Result = 1234
      end
      function ProbeRound()
        for condition = 0, Party[0].Conditions.High do
          Party[0].Conditions[condition] = 0
        end
        Party[0].HP = Party[0].FullHPBase
        local placed = 0
        for i = 0, Map.Monsters.High do
          local m = Map.Monsters[i]
          if placed < 12 and m.Hostile and not m.IsDead then
            local angle = placed * math.pi / 6
            m.X = math.floor(Party.X + math.cos(angle) * 900)
            m.Y = math.floor(Party.Y + math.sin(angle) * 900)
            m.Z = Party.Z
            if #ProbeHits == 0 then m.HP = 30000 end
            placed = placed + 1
          end
        end
        return placed
      end
      return ProbeRound()
    expect: "12"
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua:
    code: |
      local h = ProbeHits[1]
      if not h then
        return "no hit; party HP " .. tostring(Party[0].HP) .. ", condition " .. tostring(Party[0]:GetMainCondition())
      end
      -- The arrow may have found a bystander with fewer hit points than one hit takes.
      local hits = 0
      for _, other in ipairs(ProbeHits) do
        if other.monsterIndex == h.monsterIndex then hits = hits + 1 end
      end
      local lost = h.hpBefore - math.max(Map.Monsters[h.monsterIndex].HP, 0)
      return h.kind, h.byPlayer, h.melee, h.samePlayer, h.monsterIndex == h.targetIndex, h.rawPositive,
        h.spell, h.objectSpell, h.bow, h.placed, lost == math.min(h.hpBefore, 1234 * hits)
    expect: "4\ttrue\tfalse\ttrue\ttrue\ttrue\t133\t133\t56\ttrue\ttrue"
