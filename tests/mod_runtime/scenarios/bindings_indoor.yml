id: mod_runtime.bindings_indoor
title: Mod runtime reaches actors on an indoor map, and their state survives a save and load
world: mm8
mode: faithful
tags:
- mod_runtime
steps:
- new_game_flow:
    start_map: d05.blv
    party:
      gold: 10
      food: 1
      members:
      - name: Delver
        class: Knight
        level: 1
        skills: []
        equipment: {}
- mod_lua:
    code: return Map.Name, Map.Monsters.Count > 0, Map.Monsters[0].HP > 0, Map.Monsters[0].FullHP > 0
    expect: "d05.blv\ttrue\ttrue\ttrue"
- mod_lua:
    code: |
      Map.Monsters[0].HP = 2
      mapvars.indoor = "seen"
      return Map.Monsters[0].HP
    expect: "2"
- save_game: mod_bindings_indoor
- mod_lua:
    code: |
      Map.Monsters[0].HP = 1
      mapvars.indoor = nil
      return Map.Monsters[0].HP
    expect: "1"
- load_game: mod_bindings_indoor
- mod_lua:
    code: return Map.Monsters[0].HP, mapvars.indoor
    expect: "2\tseen"
- mod_lua:
    code: return Map.IsOutdoor(), Map.IsIndoor(), Map.IndoorOrOutdoor
    expect: "false\ttrue\t1"
# A monster's state, speed and AI type indoors, as outdoors (monster_state.yml): removed and brought back, hidden
# and shown, and a speed and AI type of its own.
- mod_lua:
    code: |
      local m = Map.Monsters[1]
      local before = m.AIState
      m.AIState = const.AIState.Removed
      local removed = {m.AIState, m.HP, m.IsDead}
      m.AIState = 0
      local back = {m.AIState ~= 11 and m.AIState ~= 5, m.HP > 0, m.IsDead}
      m.AIState = const.AIState.Invisible
      local hidden = m.AIState
      m.AIState = 0
      local speed = m.Velocity
      m.Velocity = speed + 50
      m.AIType = 0
      return before ~= 5 and before ~= 11, removed[1], removed[2], removed[3], back[1], back[2], back[3], hidden,
        m.AIState ~= 19, m.Velocity == speed + 50, m.AIType, m.MoveSpeed == Game.MonstersTxt[m.Id].MoveSpeed
    expect: "true\t11\t0\ttrue\ttrue\ttrue\tfalse\t19\ttrue\ttrue\t0\ttrue"
# Where a point stands indoors: the party is in a room with a floor under it, and a point far outside the map is
# in none. A monster summoned beside the party joins the map's list.
- mod_lua:
    code: |
      local before = Map.Monsters.Count
      local room = Map.RoomFromPoint(Party.X, Party.Y, Party.Z + 10)
      local floorLevel = Map.GetFloorLevel(Party.X, Party.Y, Party.Z + 10, room)
      local m = SummonMonster(1, Party.X, Party.Y, Party.Z)
      return room > 0, math.abs(floorLevel - Party.Z) < 64, Map.RoomFromPoint(Party.X + 100000, Party.Y, Party.Z),
        Map.GetFloorLevel(Party.X + 100000, Party.Y, Party.Z, 0), Map.Monsters.Count - before, m.Id, m.HP > 0
    expect: "true\ttrue\t0\t-30000\t1\t1\ttrue"
