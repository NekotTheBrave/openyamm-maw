id: mod_runtime.bindings
title: Mod runtime bindings read and write live game state and survive a save and load
world: mm8
mode: faithful
tags:
- mod_runtime
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 250
      food: 7
      members:
      - name: Binder
        class: Knight
        level: 3
        might: 21
        skills:
        - name: Sword
          level: 4
          mastery: 2
        equipment:
          main_hand: 1

# --- reading --------------------------------------------------------------------------------------------------------
- mod_lua:
    code: return Party.Gold, Party.Food, Party.Count, Party.High
    expect: "250\t7\t1\t0"
- mod_lua:
    code: local p = Party[0] return p.Name, p.ClassName, p.LevelBase, p.MightBase
    expect: "Binder\tKnight\t3\t21"
- mod_lua:
    code: return SplitSkill(Party[0].Skills[const.Skills.Sword])
    expect: "4\t2"
- mod_lua:
    code: return Party[0].Skills[const.Skills.Bow], Party[0]:GetSkill(const.Skills.Sword) == JoinSkill(4, 2)
    expect: "0\ttrue"
- mod_lua:
    code: local it = Party[0].Items[2] return it.Number, it:T().Name, it.Charges, it.Identified
    expect: "1\tIron Longsword\t0\ttrue"
# A mod may have rewritten a monster's level by now (MAW does, for every monster), so the row is checked against the
# engine's own value only when nothing wrote to it.
- mod_lua:
    code: |
      local row = Game.MonstersTxt[1]
      local written = ModRT.Bindings.tableWrites["Game.MonstersTxt[].Level"] ~= nil
      return Game.ItemsTxt[1].Name, Game.ItemsTxt[1].Value, row.Name, modrt.monsterTxtGet(1, "Level"),
        written or row.Level == 4
    expect: "Iron Longsword\t20\tLizardman Peasant\t4\ttrue"
- mod_lua:
    code: return Map.Name, Map.Monsters.Count > 0, Map.Monsters[0].HP > 0, Map.Monsters[0].HP <= Map.Monsters[0].FullHP
    expect: "out01.odm\ttrue\ttrue\ttrue"

# --- writing --------------------------------------------------------------------------------------------------------
- mod_lua:
    code: |
      Party.Gold = Party.Gold + 1000
      Party.Food = 3
      local p = Party[0]
      p.MightBase = 55
      p.Skills[const.Skills.Sword] = JoinSkill(9, 3)
      p.Skills[const.Skills.Bow] = JoinSkill(2, 1)
      local it = p.Items[2]
      it.Charges = 0x400000 + 17 * 65536 + 321
      it.MaxCharges = 42
      it.BonusExpireTime = 2
      it.Bonus = 5
      it.BonusStrength = 12
      Map.Monsters[0].HP = 3
      vars.modTest = {answer = 42, list = {1, 2, 3}, name = "kept", ratio = 0.5}
      mapvars.visited = true
      return "written"
    expect: written
- mod_lua:
    code: return Party.Gold, Party.Food, Party[0].MightBase, Map.Monsters[0].HP
    expect: "1250\t3\t55\t3"

# --- save, wreck the state, load ------------------------------------------------------------------------------------
- save_game: mod_bindings
- mod_lua:
    code: |
      Party.Gold = 1
      Party[0].MightBase = 1
      Party[0].Skills[const.Skills.Sword] = 0
      Party[0].Items[2].Charges = 0
      Map.Monsters[0].HP = 1
      vars.modTest = nil
      vars.afterSave = true
      mapvars.visited = nil
      return Party.Gold, Party[0].Skills[const.Skills.Sword]
    expect: "1\t0"
- load_game: mod_bindings

- mod_lua:
    code: return Party.Gold, Party.Food, Party[0].MightBase
    expect: "1250\t3\t55"
- mod_lua:
    code: local l, m = SplitSkill(Party[0].Skills[const.Skills.Sword]) local l2, m2 = SplitSkill(Party[0].Skills[const.Skills.Bow]) return l, m, l2, m2
    expect: "9\t3\t2\t1"
- mod_lua:
    code: local it = Party[0].Items[2] return it.Number, it.Charges == 0x400000 + 17 * 65536 + 321, it.MaxCharges, it.BonusExpireTime, it.Bonus, it.BonusStrength
    expect: "1\ttrue\t42\t2\t5\t12"
- mod_lua:
    code: return Map.Monsters[0].HP
    expect: "3"
# Block scalar: a plain YAML value would end at " #".
- mod_lua:
    code: |
      local t = vars.modTest
      return t.answer, #t.list, t.list[3], t.name, t.ratio, tostring(vars.afterSave), tostring(mapvars.visited)
    expect: "42\t3\t3\tkept\t0.5\tnil\ttrue"
