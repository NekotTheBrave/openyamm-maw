id: mod_runtime.monster_buffs
title: Map.Monsters[i].SpellBuffs reach the engine's spell effects on the monster
world: mm8
mode: faithful
tags:
- mod_runtime
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 100
      food: 5
      members:
      - name: Watcher
        class: Knight
        level: 60
        endurance: 3000
        skills: []
        equipment: {}
# A monster's spell effects by const.MonsterBuff: ExpireTime is game time (128 ticks to the second, 0 when off). MAW
# stuns with Paralyze (6) and slows with Slow (7), whose Power is the slowing factor. A paralyzed monster stays where
# it is.
- mod_lua:
    code: |
      Target = nil
      for i = 0, Map.Monsters.High do
        local m = Map.Monsters[i]
        if m.Hostile and not m.IsDead then Target = i break end
      end
      local m = Map.Monsters[Target]
      m.X, m.Y, m.Z = Party.X + 1500, Party.Y, Party.Z
      local buff = m.SpellBuffs[const.MonsterBuff.Paralyze]
      local before = buff.ExpireTime
      buff.ExpireTime = Game.Time + 128 * 5
      local left = buff.ExpireTime - Game.Time
      StartX, StartY = m.X, m.Y
      return before, left > 128 * 4 and left <= 128 * 5
    expect: "0\ttrue"
- advance_runtime: {seconds: 2}
- mod_lua:
    code: |
      local m = Map.Monsters[Target]
      local left = m.SpellBuffs[6].ExpireTime - Game.Time
      return m.X == StartX and m.Y == StartY, left > 0 and left < 128 * 4
    expect: "true\ttrue"
- advance_runtime: {seconds: 4}
- mod_lua:
    code: |
      local m = Map.Monsters[Target]
      local slow = m.SpellBuffs[const.MonsterBuff.Slow]
      slow.ExpireTime = Game.Time + 128 * 10
      slow.Power = 4
      -- Stoned (5) is not an effect the engine has: what a script writes stays with the script.
      m.SpellBuffs[5].ExpireTime = 12345
      return m.SpellBuffs[6].ExpireTime, slow.Power, slow.ExpireTime > Game.Time, m.SpellBuffs[5].ExpireTime,
        m.SpellBuffs.Count
    expect: "0\t4\ttrue\t12345\t26"
# MeleeOnly (22) and DamageHalved (23) are effects of their own: MAW's Death Knight's grasp halves a monster's damage,
# and only at Grandmaster takes its ranged attacks away. They were both the engine's Dark Grasp, which also halves
# armour and speed. Kept in a save.
- mod_lua:
    code: |
      local m = Map.Monsters[Target]
      m.SpellBuffs[const.MonsterBuff.DamageHalved].ExpireTime = Game.Time + 128 * 60
      return m.SpellBuffs[const.MonsterBuff.MeleeOnly].ExpireTime, m.SpellBuffs[23].ExpireTime > Game.Time
    expect: "0\ttrue"
- mod_lua:
    code: |
      local m = Map.Monsters[Target]
      m.SpellBuffs[const.MonsterBuff.MeleeOnly].ExpireTime = Game.Time + 128 * 30
      MeleeLeft = m.SpellBuffs[22].ExpireTime - Game.Time
      HalvedLeft = m.SpellBuffs[23].ExpireTime - Game.Time
      return MeleeLeft > 128 * 29, HalvedLeft > 128 * 59
    expect: "true\ttrue"
- save_game: mod_monster_buffs
- mod_lua:
    code: |
      local m = Map.Monsters[Target]
      m.SpellBuffs[22].ExpireTime = 0
      m.SpellBuffs[23].ExpireTime = 0
      return m.SpellBuffs[22].ExpireTime, m.SpellBuffs[23].ExpireTime
    expect: "0\t0"
- load_game: mod_monster_buffs
- mod_lua:
    code: |
      local m = Map.Monsters[Target]
      local melee, halved = m.SpellBuffs[22].ExpireTime - Game.Time, m.SpellBuffs[23].ExpireTime - Game.Time
      return melee > 128 * 25 and melee <= MeleeLeft, halved > 128 * 55 and halved <= HalvedLeft
    expect: "true\ttrue"
