id: mod_runtime.melee_event
title: A real party melee attack raises CalcDamageToMonster, and the handler's result is the damage applied
world: mm8
mode: faithful
tags:
- mod_runtime
steps:
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 100
      food: 5
      members:
      - name: Striker
        class: Knight
        level: 60
        might: 30
        endurance: 3000
        accuracy: 200
        skills:
        - name: Sword
          level: 6
          mastery: 2
        equipment:
          main_hand: 1
# Every hit's damage is replaced with a fixed, recognisable amount.
#
# ProbeRound rings hostile monsters around the party, so one is in reach whichever way the party faces, and heals
# the party. It runs before each short burst of attacking: the monsters fight back and wander, single swings miss,
# and none of that is the same on every run, so one long burst is not reliable.
- mod_lua:
    code: |
      ProbeHits = {}
      function events.CalcDamageToMonster(t)
        local attack, targetIndex = WhoHitMonster()
        ProbeHits[#ProbeHits + 1] = {
          kind = t.DamageKind, byPlayer = t.ByPlayer, melee = t.Melee, playerIndex = t.PlayerIndex,
          samePlayer = t.Player == Party.PlayersArray[t.PlayerIndex] and attack.Player == t.Player,
          monsterIndex = t.MonsterIndex, targetIndex = targetIndex, hpBefore = t.Monster.HP,
          rawPositive = t.Damage > 0,
        }
        t.Result = 1234
      end
      function ProbeRound()
        Party[0].HP = Party[0].FullHPBase
        local placed = 0
        for i = 0, Map.Monsters.High do
          local m = Map.Monsters[i]
          if placed < 12 and m.Hostile and not m.IsDead then
            local angle = placed * math.pi / 6
            m.X = math.floor(Party.X + math.cos(angle) * 130)
            m.Y = math.floor(Party.Y + math.sin(angle) * 130)
            m.Z = Party.Z
            if #ProbeHits == 0 then m.HP = 30000 end
            placed = placed + 1
          end
        end
        return placed
      end
      return ProbeRound()
    expect: "12"
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua: {code: "return ProbeRound()", expect: "12"}
- press_action: {action: attack, seconds: 3}
- mod_lua:
    code: |
      local h = ProbeHits[1]
      if not h then return "no hit; party HP " .. tostring(Party[0].HP) end
      local after = Map.Monsters[h.monsterIndex].HP
      return h.kind, h.byPlayer, h.melee, h.playerIndex == Party[0]:GetIndex(), h.samePlayer,
        h.monsterIndex == h.targetIndex, h.rawPositive, (h.hpBefore - after) % 1234
    expect: "4\ttrue\ttrue\ttrue\ttrue\ttrue\ttrue\t0"
