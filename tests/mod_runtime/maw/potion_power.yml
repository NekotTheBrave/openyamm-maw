id: mod_runtime.maw.potion_power
title: Generated potions have a power, as the original makes it
world: mm8
mode: faithful
tags:
- mod_runtime
- maw
steps:
# The original makes a potion's power two rolls of 1 to 4 times the treasure level; OpenYAMM made every generated
# potion with none, so the item box showed no power and MAW's potions (which scale with it) did little. Twenty
# potions of treasure level 3: each a multiple of 3 from 6 to 24. Run with the MAW mods.yml.
- new_game_flow:
    start_map: out01.odm
- mod_lua:
    code: |
      local bad = 0
      for i = 1, 20 do
        evt.GiveItem{Strength = 3, Type = const.ItemType.Potion}
        local power = Mouse.Item.Bonus
        if Game.ItemsTxt[Mouse.Item.Number].EquipStat ~= 14 or power < 6 or power > 24 or power % 3 ~= 0 then
          bad = bad + 1
        end
        modrt.heldItemSet(nil)
      end
      return bad
    expect: "0"
# A potion an event gives by number has power 0 in the real game too; MAW's port gives it 50 (rule
# event_potion_power, zMaw-MergeRules.lua), so a quest's potion is of use.
- mod_lua:
    code: |
      evt.Add("Inventory", 254)
      return Mouse.Item.Number, Mouse.Item.Bonus
    expect: "254\t50"
