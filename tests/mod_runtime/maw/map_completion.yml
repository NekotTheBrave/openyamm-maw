id: mod_runtime.maw.map_completion
title: MAW's map completion counts only the monsters against the party and gives its rewards
world: mm8
mode: faithful
tags:
- mod_runtime
- maw
steps:
# MAW leaves the monsters not against the party (Monster:IsAgainst(), the engine's hostility) out of a map's count:
# New Sorpigal's peasants and guards. On completion it gives gold and experience (by the monsters killed: none
# here) and crafting materials (evt.Add of
# items: into the hand, the one held before into the pack) and says so in a message box. MawMapCompleted forces it.
# Run with the MAW mods.yml.
- new_game_flow:
    start_map: oute3.odm
    party:
      gold: 200
      food: 7
      members:
      - name: Leora
        class: Knight
        level: 5
        skills:
        - name: Sword
          level: 1
          mastery: 1
        equipment: {}
- mod_lua:
    code: |
      local friendly, hostile = 0, 0
      for i = 0, Map.Monsters.High do
        if Map.Monsters[i]:IsAgainst() == 0 then friendly = friendly + 1 else hostile = hostile + 1 end
      end
      GoldBefore = Party.Gold
      local savedPrint = print
      print = function() end
      events.call("MawMapCompleted")
      print = savedPrint
      return friendly > 0, hostile > 0, tostring(mapvars.completed)
    expect: "true	true	true"
- advance_runtime: {seconds: 0.5}
- mod_lua:
    code: |
      local crafting = 0
      for _, it in ipairs(modrt.inventoryTake(0)) do
        if it.Number == 1070 or (it.Number > 1040 and it.Number <= 1050) then crafting = crafting + 1 end
        modrt.inventoryPut(0, it, it.X, it.Y)
      end
      local held = Mouse.Item.Number
      return crafting + ((held > 1040 and held <= 1050) and 1 or 0)
    expect: "3"
# MAW gives its crafting items their pictures from Lua (zzAlchemy.lua); the one in hand fits in the pack with it.
- mod_lua:
    code: |
      local held = Mouse.Item.Number
      local put = modrt.inventoryPut(0, {Number = held, Identified = true}, 6, 0)
      return Game.ItemsTxt[held].Picture ~= "" and Game.ItemsTxt[held].Picture:sub(1, 6) == "vCraft", tostring(put)
    expect: "true	true"
- assert:
    dialog:
      active: true
