# MM6's third tier archer (monster 477) casts Fireball (spell 6), 20% of its attacks in MAW's table. Its explosion
# reaches every member, as in the original; OpenYAMM had a Fireball that struck the party hit one member only (the
# area spell's direct hit took the place of its explosion). The handler groups the Fireball's PlayerAttacked calls
# by the time they come at: one Fireball, one time. The kind casts it whenever it can (its SpellChance 100 in the
# monster table; a map monster's own SpellChance is not kept by the engine): in a dungeon they shoot seldom.
- mod_lua:
    code: |
      FireballHits = {}
      function events.PlayerAttacked(t)
        if t.Attacker and t.Attacker.Spell == 6 then
          FireballHits[Game.Time] = (FireballHits[Game.Time] or 0) + 1
        end
      end
      function SpawnFireArchers(dx, dy)
        FireballHits = {}
        -- (Merge's adaptive stats put the table back as a map loads.)
        Game.MonstersTxt[477].SpellChance = 100
        pseudoSpawnpoint{monster = 477, x = Party.X + (dx or 1000), y = Party.Y + (dy or 0), z = Party.Z, count = 6,
          powerChances = {0, 0, 100}, radius = (dx and 150 or 200), group = 3,
          transform = function(mon) mon.Hostile = true end}
      end
      function HealParty()
        for i = 0, Party.High do
          Party[i].HP = Party[i]:GetFullHP() Party[i].Dead = 0 Party[i].Unconscious = 0
        end
      end
      -- How many Fireballs struck, and how many of them reached fewer than four members.
      function FireballReport()
        local fireballs, partial = 0, 0
        for _, members in pairs(FireballHits) do
          fireballs = fireballs + 1
          if members < 4 then partial = partial + 1 end
        end
        return fireballs > 0, partial
      end
      SpawnFireArchers()
      return 0
    expect: "0"
- advance_runtime: {seconds: 15}
- mod_lua: {code: "HealParty() return 0", expect: "0"}
- advance_runtime: {seconds: 15}
- mod_lua:
    code: return FireballReport()
    expect: "true\t0"
# In a dungeon the indoor runtime builds the explosion itself. The archers come in 600 units north of the party, in
# its sight (a point 1000 units east is behind a wall, and next to the party they pursue it instead of shooting).
- load_map:
    map: d05.blv
- mod_lua: {code: "HealParty() SpawnFireArchers(0, 600) return 0", expect: "0"}
- advance_runtime: {seconds: 15}
- mod_lua: {code: "HealParty() return 0", expect: "0"}
- advance_runtime: {seconds: 15}
- mod_lua: {code: "HealParty() return 0", expect: "0"}
- advance_runtime: {seconds: 15}
- mod_lua: {code: "HealParty() return 0", expect: "0"}
- advance_runtime: {seconds: 15}
- mod_lua:
    code: return FireballReport()
    expect: "true\t0"
