id: mod_runtime.maw.parity_new_knight
title: MAW's numbers for a fresh Knight match the real game (MAW main at fc21aaff, MAW difficulty)
world: mm8
mode: faithful
tags:
- mod_runtime
- maw
steps:
# The character of parity/Stats.png, Skills.png and Inventory.png: a level 1 Knight as the original game's
# character creation made her, nothing equipped, read off a real install of the same MAW (Desktop/MAW5) on
# 2026-10-13. Run with the MAW mods.yml, not with the test mod.
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 200
      food: 7
      members:
      - name: Barbara
        class: Knight
        level: 1
        might: 18
        intellect: 9
        personality: 9
        endurance: 15
        accuracy: 15
        speed: 15
        luck: 11
        skills:
        - name: Axe
          level: 1
          mastery: 1
        - name: Bow
          level: 1
          mastery: 1
        - name: Sword
          level: 1
          mastery: 1
        - name: Plate
          level: 1
          mastery: 1
        equipment: {}
# The sheet: Hit Points 43, Spell Points 0, Armor Class 0, Attack +1, Damage 2, Shoot +1, every resistance -1.
- mod_lua:
    code: |
      local pl = Party[0]
      local resistances = {}
      for stat = 10, 15 do
        resistances[#resistances + 1] = pl:GetResistance(stat)
      end
      return pl:GetFullHP(), pl:GetFullSP(), pl:GetArmorClass(), pl:GetMeleeAttack(),
        pl:GetMeleeDamageMin() .. "-" .. pl:GetMeleeDamageMax(), pl:GetRangedAttack(),
        table.concat(resistances, ",")
    expect: "43\t0\t0\t1\t2-2\t1\t-1,-1,-1,-1,-1,-1"
# MAW's own figures at the bottom of the sheet: "M/R: 1/0" and "Vitality: 45".
- mod_lua:
    code: |
      local melee, ranged, spell, vitality = calcPowerVitality(Party[0], true)
      return tostring(melee), tostring(ranged), tostring(vitality)
    expect: "1\t0\t45"
