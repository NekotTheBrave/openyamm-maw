id: mod_runtime.maw.parity_knight_equipped
title: MAW's numbers for a fresh Knight with sword, breastplate and crossbow match the real game
world: mm8
mode: faithful
tags:
- mod_runtime
- maw
steps:
# The character of parity/Equipped.png with the items of Sword.png, Armor.png and Crossbow.png, read off a real
# install of the same MAW (Desktop/MAW5) on 2026-10-13: Iron Broadsword (item 11), Rusty Breastplate (94), Crude
# Crossbow (849). Her statistics and skills are those of the unequipped Knight of parity_new_knight.yml (a later
# character with the same sheet confirmed the skills, parity/JSkills.png). Run with the MAW mods.yml.
- new_game_flow:
    start_map: out01.odm
    party:
      gold: 200
      food: 7
      members:
      - name: Leora
        class: Knight
        level: 1
        might: 18
        intellect: 9
        personality: 9
        endurance: 15
        accuracy: 15
        speed: 15
        luck: 11
        skills:
        - name: Axe
          level: 1
          mastery: 1
        - name: Bow
          level: 1
          mastery: 1
        - name: Sword
          level: 1
          mastery: 1
        - name: Plate
          level: 1
          mastery: 1
        equipment:
          main_hand: 11
          armor: 94
          bow: 849
# The sheet: Hit Points 43, Spell Points 0, Armor Class 20, Attack +2, Damage 6 - 12, Shoot +3, Damage 4 - 11,
# resistances -1. Armor class is 18 from the breastplate and 2 from the Plate skill, which counts as 4: MAW gives
# humans +3 to the armor skills (the skill's tooltip says "Bonus: +3", parity/JPlate.png).
- mod_lua:
    code: |
      local pl = Party[0]
      local resistances = {}
      for stat = 10, 15 do
        resistances[#resistances + 1] = pl:GetResistance(stat)
      end
      local plateLevel, plateMastery = SplitSkill(pl:GetSkill(const.Skills.Plate))
      return pl:GetFullHP(), pl:GetFullSP(), pl:GetArmorClass(), plateLevel, plateMastery, pl:GetMeleeAttack(),
        pl:GetMeleeDamageMin() .. "-" .. pl:GetMeleeDamageMax(), pl:GetRangedAttack(),
        pl:GetRangedDamageMin() .. "-" .. pl:GetRangedDamageMax(), table.concat(resistances, ",")
    expect: "43\t0\t20\t4\t1\t2\t6-12\t3\t4-11\t-1,-1,-1,-1,-1,-1"
# The item tooltips: damage 3 - 9 at attack speed 0.6 for the sword and 0.8 for the crossbow, armor +18, and the
# values 20, 300 and 10, which are MAW's own (the item table says 50, 750 and 25).
- mod_lua:
    code: |
      local pl = Party[0]
      local sword, armor, bow = pl:GetActiveItem(1), pl:GetActiveItem(3), pl:GetActiveItem(2)
      local function dice(item)
        local row = item:T()
        return row.Mod1DiceCount + row.Mod2 .. "-" .. row.Mod1DiceCount * row.Mod1DiceSides + row.Mod2
      end
      pl:GetAttackDelay()
      pl:GetAttackDelay(true)
      local speed = damageMultiplier[pl:GetIndex()]
      return sword:T().Name, dice(sword), speed.baseSpeedMelee, bow:T().Name, dice(bow), speed.baseSpeedRanged,
        armor:T().Name, armor:T().Mod1DiceCount + armor:T().Mod2,
        getItemValue(sword), getItemValue(armor), getItemValue(bow)
    expect: "Iron Broadsword\t3-9\t60\tCrude Crossbow\t3-9\t80\tRusty Breastplate\t18\t20\t300\t10"
# Those values are what the game itself now takes the items to be worth (tooltips, shops, identifying, repairing):
# MAW answers the engine through CalcItemValue.
- mod_lua:
    code: |
      local pl = Party[0]
      return pl:GetActiveItem(1):GetValue(), pl:GetActiveItem(3):GetValue(), pl:GetActiveItem(2):GetValue()
    expect: "20\t300\t10"
# MAW's own "M/R: 3/2" and "Vitality: 48".
- mod_lua:
    code: |
      local melee, ranged, spell, vitality = calcPowerVitality(Party[0], true)
      return tostring(melee), tostring(ranged), tostring(vitality)
    expect: "3\t2\t48"
# The information boxes, as the real game shows them (parity/Sword.png, Armor.png, Crossbow.png): MAW adds the
# attack speed under the type, gives the damage as a range, and ends the description with the level required. The
# texts handed in are the engine's own wording for these items; lines are joined with "|" here, colours left out.
- mod_lua:
    code: |
      local pl = Party[0]
      local engine = {
        [1] = {Type = "Type: Broadsword", BasicStat = "Attack: +0   Damage: 3d3"},
        [3] = {Type = "Type: Plate Armor", BasicStat = "Armor: +18"},
        [2] = {Type = "Type: Crossbow", BasicStat = "Shoot: +0   Damage: 3d3"},
      }
      local out = {}
      for _, slot in ipairs{1, 3, 2} do
        local item = pl:GetActiveItem(slot)
        local texts = engine[slot]
        texts.Name, texts.Enchantment, texts.Description = item:T().Name, "", "Notes."
        local box = item:BuildInformationBox(texts)
        out[#out + 1] = table.concat({box.Name, box.Type, box.BasicStat, box.Enchantment, box.Description}, "; ")
      end
      return (table.concat(out, " ## "):gsub("\f%d%d%d%d%d", ""):gsub("\n", "|"))
    expect: >-
      Iron Broadsword; Type: Broadsword|Attack Speed: 0.6; Attack: +0  Damage: 3-9; ; Notes.||Level Required: 1 ##
      Rusty Breastplate; Type: Plate Armor; Armor: +18; ; Notes.||Level Required: 1 ##
      Crude Crossbow; Type: Crossbow|Attack Speed: 0.8; Attack: +0  Damage: 3-9; ; Notes.||Level Required: 1
# With Alt held MAW adds what the item could be crafted into: a grey enchantment it might take ("<stat> +X") and
# its bonus power, "Item Bonus Power: 0/255" for the breastplate (parity/Armor.png was taken with Alt held). The key
# events are fed here as the game feeds them.
- mod_lua:
    code: |
      local armor = Party[0]:GetActiveItem(3)
      local function box()
        return armor:BuildInformationBox{Name = armor:T().Name, Type = "Type: Plate Armor", BasicStat = "Armor: +18",
          Enchantment = "", Description = "Notes."}
      end
      ModRT.key(true, 0x12, false, true, false, false)
      local held = box()
      ModRT.key(false, 0x12, false, true, false, false)
      local released = box()
      local function plain(text) return (text:gsub("\f%d%d%d%d%d", ""):gsub("\n", "|")) end
      return plain(held.Enchantment):match("^[%a ]+ %+X$") ~= nil, plain(held.Description), plain(released.Description)
    expect: "true\tNotes.||Item Bonus Power: 0/255||Level Required: 1\tNotes.||Level Required: 1"
