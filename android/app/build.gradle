plugins {
    id "com.android.application"
}

def sdl3SourceDirPath = project.findProperty("OPENYAMM_SDL3_SOURCE_DIR") ?: System.getenv("OPENYAMM_SDL3_SOURCE_DIR")
if (sdl3SourceDirPath == null || sdl3SourceDirPath.toString().trim().isEmpty()) {
    sdl3SourceDirPath = "${rootDir}/../build/_deps/sdl3-src"
}

def sdl3SourceDir = file(sdl3SourceDirPath)
if (!sdl3SourceDir.isDirectory()) {
    throw new GradleException(
        "SDL3 source directory not found: ${sdl3SourceDir}. " +
        "Build the desktop project once or pass -POPENYAMM_SDL3_SOURCE_DIR=/path/to/SDL."
    )
}

def signingPropertiesFile = file("${rootDir}/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { propertyName, envName ->
    def value = signingProperties.getProperty(propertyName)
    if (value == null || value.toString().trim().isEmpty()) {
        value = project.findProperty("openyamm.signing.${propertyName}")
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(envName)
    }
    return value == null ? null : value.toString()
}

def releaseStoreFilePath = signingValue("storeFile", "OPENYAMM_ANDROID_KEYSTORE")
def releaseStorePassword = signingValue("storePassword", "OPENYAMM_ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = signingValue("keyAlias", "OPENYAMM_ANDROID_KEY_ALIAS")
def releaseKeyPassword = signingValue("keyPassword", "OPENYAMM_ANDROID_KEY_PASSWORD")
def releaseSigningReady = releaseStoreFilePath != null
    && releaseStorePassword != null
    && releaseKeyAlias != null
    && releaseKeyPassword != null
def releaseAbiValue = project.findProperty("openyamm.android.releaseAbis")
if (releaseAbiValue == null || releaseAbiValue.toString().trim().isEmpty()) {
    releaseAbiValue = System.getenv("OPENYAMM_ANDROID_RELEASE_ABIS")
}
def releaseAbis = releaseAbiValue == null || releaseAbiValue.toString().trim().isEmpty()
    ? ["arm64-v8a"]
    : releaseAbiValue.toString().split(",").collect { it.trim() }.findAll { !it.isEmpty() }
def profileableValue = project.findProperty("openyamm.android.profileable")
if (profileableValue == null || profileableValue.toString().trim().isEmpty()) {
    profileableValue = System.getenv("OPENYAMM_ANDROID_PROFILEABLE")
}
def profileableFromShell = profileableValue != null
    && ["1", "true", "yes", "on"].contains(profileableValue.toString().trim().toLowerCase())
def androidVersionValue = { environmentName, propertyName ->
    def value = System.getenv(environmentName)
    if (value == null || value.toString().trim().isEmpty()) {
        value = project.findProperty(propertyName)
    }
    if (value == null || value.toString().trim().isEmpty()) {
        throw new GradleException("Missing Android version value: ${propertyName}")
    }
    return value.toString().trim()
}

def appVersionName = androidVersionValue("OPENYAMM_ANDROID_VERSION_NAME", "openyamm.android.versionName")
def appVersionCode = androidVersionValue(
    "OPENYAMM_ANDROID_VERSION_CODE",
    "openyamm.android.versionCode"
).toInteger()

android {
    namespace "org.openyamm.android"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "org.openyamm.android"
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [
            openyammProfileableFromShell: profileableFromShell.toString()
        ]

        externalNativeBuild {
            cmake {
                arguments(
                    "-DANDROID_PLATFORM=android-23",
                    "-DANDROID_STL=c++_shared",
                    "-DOPENYAMM_SDL3_SOURCE_DIR=${sdl3SourceDir.absolutePath}",
                    "-DOPENYAMM_BUILD_DESKTOP_EXECUTABLE=OFF",
                    "-DOPENYAMM_BUILD_TESTS=OFF",
                    "-DOPENYAMM_BUILD_EDITOR=OFF",
                    "-DOPENYAMM_BUILD_TOOLS=OFF",
                    "-DOPENYAMM_DEV_ASSETS_DIR=assets",
                    "-DOPENYAMM_WINDOW_WIDTH=1280",
                    "-DOPENYAMM_WINDOW_HEIGHT=720",
                    "-DOPENYAMM_HOST_SHADERC=${System.getenv("OPENYAMM_HOST_SHADERC") ?: "${rootDir}/../build/openyamm_shaderc"}",
                    "-DOPENYAMM_BGFX_DEBUG=${System.getenv("OPENYAMM_BGFX_DEBUG") ?: "OFF"}"
                )
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs += "${sdl3SourceDir}/android-project/app/src/main/java"
        }
        debug {
            assets.srcDirs = [
                "${buildDir}/generated/openyammApkAssets/debug"
            ]
        }
        release {
            assets.srcDirs = [
                "${buildDir}/generated/openyammApkAssets/release"
            ]
        }
    }

    androidResources {
        // Keep _legacy bake dependencies; the default <dir>_* filter silently drops them from the APK.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
        // Cooked textures are already Zstandard-compressed: deflate saves nothing and costs an inflate per load.
        noCompress += ["zip", "ogv", "oyatlas", "oytex"]
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
            externalNativeBuild {
                cmake {
                    abiFilters "arm64-v8a", "x86_64"
                    arguments "-DOPENYAMM_ANDROID_APK_SHADER_DIR=${buildDir}/openyammShaders/debug"
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            ndk {
                abiFilters(*releaseAbis)
            }
            externalNativeBuild {
                cmake {
                    abiFilters(*releaseAbis)
                    arguments "-DOPENYAMM_ANDROID_APK_SHADER_DIR=${buildDir}/openyammShaders/release"
                }
            }
        }
    }

    lint {
        abortOnError false
    }
}

def runtimeAssetsRoot = file(project.findProperty("openyamm.android.runtimeAssetsDir") ?: "${rootDir}/../build/android-assets")
// "bundled" (development builds): the content packs go into the APK. "download" (published releases, packaging/UPDATER_PLAN.md
// 9.3): a thin APK whose update screen downloads the packs into app storage.
def contentMode = (project.findProperty("openyamm.android.content") ?: System.getenv("OPENYAMM_ANDROID_CONTENT")
    ?: "bundled").toString()
if (!["bundled", "download"].contains(contentMode)) {
    throw new GradleException("openyamm.android.content must be bundled or download, not ${contentMode}")
}
def openYammLicenseFiles = files("${rootDir}/../LICENSE", "${rootDir}/../COPYRIGHT")

def registerOpenYammApkAssetsTask = { taskName, nativeBuildTaskName, shaderBuildDirectories, generatedAssetsRoot ->
    tasks.register(taskName) {
        dependsOn(nativeBuildTaskName)

        // The content packs and their index (tools/package_runtime_assets.py) go into the APK unchanged; they are
        // stored uncompressed (noCompress "zip"), and the game mounts them in place.
        def contentIndex = new File(runtimeAssetsRoot, "index.json")
        def contentPacks = new File(runtimeAssetsRoot, "packs")

        inputs.property("contentMode", contentMode)
        if (contentMode == "bundled") {
            inputs.files(contentIndex, fileTree(contentPacks))
        }
        inputs.files(openYammLicenseFiles)
        inputs.files(shaderBuildDirectories.collect { shaderBuildDirectory ->
            fileTree(shaderBuildDirectory) {
                include("*/runtime/shaders/**")
            }
        })
        outputs.dir(generatedAssetsRoot)

        doLast {
            delete(generatedAssetsRoot)

            if (contentMode == "bundled" && !contentIndex.isFile()) {
                throw new GradleException(
                    "Missing runtime content ${contentIndex}. " +
                    "Run android/repack_runtime_assets.sh before building the Android APK."
                )
            }
            if (contentMode == "bundled") {
                def index = new groovy.json.JsonSlurper().parse(contentIndex)
                if (index.schema != 1 || index.profile != "android") {
                    throw new GradleException("${contentIndex} must hold the Android content profile. " +
                        "Run android/repack_runtime_assets.sh.")
                }
                index.packs.each { pack ->
                    def packFile = new File(contentPacks, pack.file)
                    if (!packFile.isFile() || packFile.length() != pack.size) {
                        throw new GradleException("Content pack ${packFile} is missing or does not match the " +
                            "index. Run android/repack_runtime_assets.sh.")
                    }
                }
                copy {
                    from(contentIndex)
                    into(generatedAssetsRoot)
                }
                copy {
                    from(contentPacks) {
                        include(index.packs.collect { it.file })
                    }
                    into(file("${generatedAssetsRoot}/packs"))
                }
            }

            copy {
                from(openYammLicenseFiles)
                into(file("${generatedAssetsRoot}/licenses/openyamm"))
            }

            copy {
                shaderBuildDirectories.each { shaderBuildDirectory ->
                    from(fileTree(shaderBuildDirectory) {
                        include("*/runtime/shaders/**")
                    }) {
                        eachFile { details ->
                            def segments = details.relativePath.segments
                            def runtimeIndex = segments.findIndexOf { it == "runtime" }
                            if (runtimeIndex >= 0) {
                                details.relativePath = new RelativePath(
                                    !details.directory,
                                    segments[runtimeIndex..-1] as String[]
                                )
                            }
                        }
                        includeEmptyDirs = false
                        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
                    }
                }
                into(generatedAssetsRoot)
            }
        }
    }
}

registerOpenYammApkAssetsTask(
    "syncOpenYammDebugApkAssets",
    "externalNativeBuildDebug",
    [file("${buildDir}/openyammShaders/debug")],
    file("${buildDir}/generated/openyammApkAssets/debug")
)
registerOpenYammApkAssetsTask(
    "syncOpenYammReleaseApkAssets",
    "externalNativeBuildRelease",
    [file("${buildDir}/openyammShaders/release")],
    file("${buildDir}/generated/openyammApkAssets/release")
)

tasks.matching { it.name == "mergeDebugAssets" }.configureEach {
    dependsOn("syncOpenYammDebugApkAssets")
}

tasks.matching { it.name == "mergeReleaseAssets" }.configureEach {
    dependsOn("syncOpenYammReleaseApkAssets")
}

tasks.matching { it.name.contains("Release") && it.name.toLowerCase().contains("lint") }.configureEach {
    dependsOn("syncOpenYammReleaseApkAssets")
}

tasks.matching { it.name == "packageRelease" }.configureEach {
    doFirst {
        if (!releaseSigningReady) {
            throw new GradleException(
                "Release signing is not configured. Use android/build_release_apk.sh, " +
                "android/signing.properties, or OPENYAMM_ANDROID_KEYSTORE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD."
            )
        }
    }
}
